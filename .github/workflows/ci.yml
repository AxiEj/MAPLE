name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install and run smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install MAPLE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q maple

      - name: Verify imports and CLI version
        run: |
          python - <<'PY'
          import importlib.metadata
          import maple
          from maple.main import main

          print("maple package:", maple.__file__)
          print("maple version:", importlib.metadata.version("maple"))
          print("maple CLI entrypoint:", main.__module__)
          PY
          maple --version

      - name: Run no-backend CLI smoke path
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          maple md nve
          test -s nve.mdp
          grep -Eq '^ensemble[[:space:]]*=[[:space:]]*nve' nve.mdp
          grep -Eq '^integrator[[:space:]]*=' nve.mdp
