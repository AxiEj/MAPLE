name: MD PBC validation

# PBC-MD release gate (WS7).  Three layers, all backend-free against the
# Lennard-Jones reference calculator (a real conservative potential with
# stress), so CI needs no ML weights / CUDA / auth:
#   1. unit layer    — fake/cheap calculators, never skipped (default markers).
#   2. production    — the non-skippable acceptance matrix (-m production).
#   3. report        — scripts/production_validation.py emits a dated artifact.
# The real-backend smoke (MACE-MP / AIMNet2-PBC / UMA periodic stress + short
# NVE/NPT) needs weights and is NOT run here; run it manually on a machine with
# the backend installed, e.g.:
#   pytest tests/integration -m integration
#   python scripts/production_validation.py --model mace-mp-pbc-small --device cuda

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  md-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (backend-free; LJ reference needs only numpy/scipy/ase)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy ase pytest
          python -m pip install -e .

      - name: Unit layer (fake/cheap calculators; default markers, never skipped)
        run: pytest tests/dispatcher/md tests/calculator tests/read

      - name: Production acceptance matrix (non-skippable, LJ reference)
        run: pytest tests/production -m production

      - name: Emit dated acceptance report + provenance manifests
        run: python scripts/production_validation.py

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md-acceptance-reports
          path: validation/reports/
          if-no-files-found: warn
