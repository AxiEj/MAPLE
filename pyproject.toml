[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "maple"
version = "0.1.2"
description = "MAPLE: MAchine-learning Potential for Landscape Exploration"
requires-python = ">=3.9"
dependencies = []  # No required dependencies

[project.scripts]
maple = "maple.main:main"

# Optional dependencies - user can choose what to install
[project.optional-dependencies]
# Full installation with all features
full = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "torch>=2.0",
    "fairchem-core>=1.0",
]

# Minimal scientific computing
minimal = [
    "numpy>=1.20",
    "scipy>=1.7",
]

# Optional periodic-boundary backends
pbc-aimnet = [
    "aimnet[ase]",
]
pbc-mace = [
    "mace-torch>=0.3.14,<0.4",
]
# graph_longrange is required by PolarMACE at runtime and is not yet on PyPI;
# pinned to git per upstream docs.
pbc-macepol = [
    "mace-torch>=0.3.16,<0.4",
    "graph_longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git",
]

# Development tools
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maple*"]
