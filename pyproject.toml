[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "maple"
version = "0.1.4"
description = "MAPLE: MAchine-learning Potential for Landscape Exploration"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Independent OBC-II is the default GB runtime.  Torch remains unpinned so
# users can select a wheel compatible with their CPU/CUDA environment.
implicit-gb = ["torch"]
implicit = ["torch"]
implicit-obc2-torch = ["torch"]
# The five legacy Amber GB implementations and LCPO remain explicit OpenMM.
implicit-openmm = ["openmm==8.5.2"]
# Explicit numerical LPB reference only; does not alter the GB/product extra.
implicit-ddlpb = ["openmm==8.5.2", "pyddx==0.8.0"]
# PyMBAR is optional because most MAPLE tasks do not perform multistate
# free-energy analysis.  Route 1 delegates MBAR and time-series decorrelation to
# this maintained upstream implementation instead of shipping a local estimator.
implicit-free-energy = ["openmm==8.5.2", "pymbar==4.0.3"]
# PyTorch/CUDA and fairchem-core are intentionally not declared here because
# users must install versions that match their CUDA/CPU runtime before using
# MAPLE's torch-backed and UMA/PBC-backed models. fairchem-core supplies its
# own UMA runtime companions such as huggingface-hub and omegaconf.

[project.scripts]
maple = "maple.main:main"

[tool.setuptools.packages.find]
include = ["maple*"]

[tool.setuptools.package-data]
"maple.function.calculator.extra_correction.implicit.data" = ["*.json", "*.txt"]
"maple.function.calculator.data" = ["*.json"]
