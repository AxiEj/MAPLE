[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "maple"
version = "0.1.4"
description = "MAPLE: MAchine-learning Potential for Landscape Exploration"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# OpenMM supplies the five upstream Amber GB implementations.  Route 1 depends
# on private customgbforces/LCPO modules, so installation is pinned to the
# exact release covered by provider parity and the runtime compatibility gate.
# APBS and AmberTools remain external executables.
implicit-gb = ["openmm==8.5.2"]
implicit = ["openmm==8.5.2"]
# Explicit numerical LPB reference only; does not alter the GB/product extra.
implicit-ddlpb = ["openmm==8.5.2", "pyddx==0.8.0"]
# PyMBAR is optional because most MAPLE tasks do not perform multistate
# free-energy analysis.  Route 1 delegates MBAR and time-series decorrelation to
# this maintained upstream implementation instead of shipping a local estimator.
implicit-free-energy = ["openmm==8.5.2", "pymbar==4.0.3"]
# Independent OBC-II runtime. Users who require a particular CPU/CUDA build
# should install that Torch build first; qualification records the actual
# version/device/dtype cell rather than claiming universal Torch compatibility.
implicit-obc2-torch = ["torch"]
# Apart from the explicit independent-OBC extra above, backend-specific
# PyTorch/CUDA and fairchem-core stacks remain user-managed so they can match
# the selected runtime. fairchem-core supplies its own UMA companions such as
# huggingface-hub and omegaconf.

[project.scripts]
maple = "maple.main:main"

[tool.setuptools.packages.find]
include = ["maple*"]

[tool.setuptools.package-data]
"maple.function.calculator.extra_correction.implicit.data" = ["*.json", "*.txt"]
"maple.function.calculator" = ["data/*.json"]
