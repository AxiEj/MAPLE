[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "maple"
version = "0.1.4"
description = "MAPLE: MAchine-learning Potential for Landscape Exploration"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
    "scipy>=1.7",
]
# PyTorch/CUDA and fairchem-core are intentionally not declared here because
# users must install versions that match their CUDA/CPU runtime before using
# MAPLE's torch-backed and UMA/PBC-backed models. fairchem-core supplies its
# own UMA runtime companions such as huggingface-hub and omegaconf.

[project.scripts]
maple = "maple.main:main"

# Optional dependencies - user can choose what to install
[project.optional-dependencies]
# Full installation with all features
full = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "torch>=2.0",
    "fairchem-core>=1.0",
]

# Minimal scientific computing
minimal = [
    "numpy>=1.20",
    "scipy>=1.7",
]

# Optional periodic-boundary backends
pbc-aimnet = [
    "aimnet[ase]",
]
pbc-mace = [
    "mace-torch>=0.3.14,<0.4",
]
# graph_longrange is required by PolarMACE at runtime and is not yet on PyPI; it
# is pinned to the exact git commit matching the validated install
# (graph_longrange 0.4.0) so reinstalls are reproducible. Bump the SHA together
# with the version recorded in the MD provenance manifest when upgrading.
pbc-macepol = [
    "mace-torch>=0.3.16,<0.4",
    "graph_longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git@0e21d5546c482d08388a08eb4d948e833227ce47",
]

# Development tools
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Three-layer MD validation taxonomy (WS3):
#   (default)     unit tests — fake calculators, always run, never skip.
#   integration   real-backend smoke — importorskip + skip on weight/auth/CUDA flakiness.
#   production    non-skippable release acceptance matrix — emits a dated artifact.
# The default run (and CI) excludes the real-backend layers; run them explicitly
# with e.g. `pytest tests/integration -m integration`.
markers = [
    "integration: real ML-backend smoke tests (may skip on missing weights/CUDA/auth)",
    "production: non-skippable release acceptance-matrix validation",
]
addopts = "-m 'not integration and not production'"
