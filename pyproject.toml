[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "maple"
version = "0.1.4"
description = "MAPLE: MAchine-learning Potential for Landscape Exploration"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Route 2's pyddx/PySCF backend is deliberately an opt-in research runtime:
# ordinary MAPLE installations do not need compiled continuum libraries.  The
# exact pins mirror the import guards in ``pyddx_pcm_response.py`` and the SMD
# provenance contract, so an explicit install produces one coherent Python
# environment instead of a mixed ``PYTHONPATH`` process.
route2-pyddx = [
    "pyddx==0.8.0",
    "pyscf==2.13.1",
]

# PyTorch/CUDA and fairchem-core are intentionally not declared here because
# users must install versions that match their CUDA/CPU runtime before using
# MAPLE's torch-backed and UMA/PBC-backed models. fairchem-core supplies its
# own UMA runtime companions such as huggingface-hub and omegaconf.
# Route-2 users install the contract-pinned mace-torch==0.3.16 themselves. The
# default energy path needs an external PCMSolver libpcm.so plus matching Python
# parser. The ``route2-pyddx`` extra supplies the exact pyddx==0.8.0 and
# pyscf==2.13.1 research runtime; the ASL model weights and continuum runtimes
# are not redistributed by MAPLE.

[project.scripts]
maple = "maple.main:main"
maple-cosmors-kse = "maple.function.cosmors_torch.kse:main"

[tool.setuptools.packages.find]
include = ["maple*"]
