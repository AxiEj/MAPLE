# Required real-backend acceptance reports before MAPLE may claim PBC-MD support.
#
# `production_validation.py` proves one calculator target at a time.  This file is
# the aggregate release contract checked by:
#
#   python scripts/check_production_backend_matrix.py
#
# Scope split (deliberate):
# - production_npt targets must pass the full thermodynamic NPT sampling matrix,
#   including c-rescale volume-fluctuation self-consistency.
# - mic_compatibility targets are finite-real-space/MIC-safe compatibility gates.
#   They prove unit/stress/cutoff/provenance/restart/PBC/NPT-mechanics behavior,
#   but they explicitly do NOT certify production NPT volume sampling.  This keeps
#   DSF from being fake-greened by deleting a hard thermodynamic gate globally.
#
# LJ/reference reports validate the MAPLE MD engine. They do not validate ML backend
# stress sign/unit/magnitude, long-range Coulomb options, or per-model NPT behavior.
# Each target below must have a non-smoke report from the current clean commit,
# with full Voigt stress finite-difference passing and zero c-rescale clamp events.

minimum_thresholds_version = "1.7.3"

[scopes.production_npt]
required_classes = [
  "nve_energy_drift",
  "restart_determinism",
  "nvt_mean_temperature",
  "npt_pressure",
  "npt_com_pressure_invariance",
  "npt_volume_fluctuation",
  "npt_effective_energy_drift",
  "barostat_clamp_free",
  "stress_finite_difference",
  "pbc_geometry",
  "constraints_rejected",
]

[scopes.mic_compatibility]
required_classes = [
  "nve_energy_drift",
  "restart_determinism",
  "nvt_mean_temperature",
  "npt_pressure",
  "npt_com_pressure_invariance",
  "npt_effective_energy_drift",
  "barostat_clamp_free",
  "stress_finite_difference",
  "pbc_geometry",
  "constraints_rejected",
]

[[targets]]
id = "aimnet2-pbc-dsf"
model = "aimnet2-pbc"
model_options = { coulomb = "dsf", cutoff = 5.0 }
validation_scope = "mic_compatibility"

[[targets]]
id = "aimnet2-pbc-ewald"
model = "aimnet2-pbc"
model_options = { coulomb = "ewald" }

[[targets]]
id = "aimnet2-pbc-pme"
model = "aimnet2-pbc"
model_options = { coulomb = "pme" }

[[targets]]
id = "aimnet2nse-pbc-dsf"
model = "aimnet2nse-pbc"
model_options = { coulomb = "dsf", cutoff = 5.0 }
validation_scope = "mic_compatibility"

[[targets]]
id = "aimnet2nse-pbc-ewald"
model = "aimnet2nse-pbc"
model_options = { coulomb = "ewald" }

[[targets]]
id = "aimnet2nse-pbc-pme"
model = "aimnet2nse-pbc"
model_options = { coulomb = "pme" }

[[targets]]
id = "mace-mp-pbc-small"
model = "mace-mp-pbc-small"
model_options = {}

[[targets]]
id = "mace-mp-pbc-medium"
model = "mace-mp-pbc-medium"
model_options = {}

[[targets]]
id = "mace-mp-pbc-large"
model = "mace-mp-pbc-large"
model_options = {}

[[targets]]
id = "macepol-pbc-small"
model = "macepol-pbc-small"
model_options = { default_dtype = "float64" }

[[targets]]
id = "macepol-pbc-medium"
model = "macepol-pbc-medium"
model_options = { default_dtype = "float64" }

[[targets]]
id = "macepol-pbc-large"
model = "macepol-pbc-large"
model_options = { default_dtype = "float64" }

[[targets]]
id = "uma-omat-default"
model = "uma"
model_options = { task = "omat", size = "uma-s-1p1" }
