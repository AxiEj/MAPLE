# Pre-registered MD acceptance thresholds (WS3).
#
# These are fixed BEFORE running the acceptance matrix and are versioned with
# every report, so the standards are never tuned to the results. A first version
# may be loose, but it is written down in advance and bumped deliberately.
#
# 1.1.0 (WS3): add the [npt_volume_fluctuation] class (EOS-slope vs
# fluctuation-identity compressibility consistency) and tighten the stress
# finite-difference magnitude tolerance after confirming the LJ reference passes.
# 1.2.0 (WS7): fix the [nvt_mean_temperature] gate to use the standard error of
# the MEAN (block-averaged, i.i.d.-floored) instead of the instantaneous spread,
# and add the [npt_effective_energy_drift] class for the reversible c-rescale
# conserved-quantity (effective-energy) drift.
# 1.3.0 (WS8): upgrade [stress_finite_difference] from a hydrostatic trace check
# to the full ASE Voigt tensor [xx, yy, zz, yz, xz, xy] on a deformed triclinic
# LJ cell, with component-wise absolute, relative and log-magnitude reporting.
# 1.4.0 (WS9): align the NPT driver with the Bernetti-Bussi reversible-Euler
# ordering (sqrt-volume scaling before Velocity Verlet).  The effective-energy
# drift gate remains tight; the volume-fluctuation/EOS consistency band is kept
# as a loose finite-sampling sanity check under the new ordering.
# 1.5.0 (WS10): make the NPT volume-fluctuation gate exercise the Bernetti-Bussi
# N_P stride path (barostat_stride>1), so production validation covers a
# distribution-level strided c-rescale run instead of only single-step N_P=1
# propagation plus separate white-box stride tests.
# 1.6.0 (WS11): add an imposed-COM NPT pressure/barostat invariance gate so
# c-rescale pressure uses K-K_cm whenever the resolved DOF policy excludes COM.
# 1.6.1: keep the imposed-COM pressure gate exact while allowing 1e-7 A^3 of
# backend floating-point noise in the deterministic volume-response comparison.
# 1.7.0: require the NPT volume-fluctuation analysis window to be stationary
# before using Var(V) as an equilibrium compressibility estimator.  This prevents
# non-equilibrated monotonic volume relaxation from false-passing or false-failing
# the kappa consistency check.
# 1.7.1: register the pressure-coupling time used by the volume-fluctuation gate
# so the small real-backend CO2 cell has enough deterministic pressure response
# relative to c-rescale stochastic noise without changing the kappa tolerance.
# 1.7.2: reduce the volume-fluctuation EOS secant to 1->200 bar for the finite
# real-backend CO2 cell. The previous 1->500 bar run exceeded the registered
# linear-response guard (rel_volume_change > 0.25), so it was not a valid kappa
# secant for this validation system.
#
# This is the PRODUCTION (ship-gate) profile, used by `pytest tests/production
# -m production` and scripts/production_validation.py. WS-D split the loose,
# short-run unit-layer thresholds into validation/thresholds.smoke.toml so this
# profile can be tightened against a longer-run baseline without false-failing the
# default short unit runs. Production values are unchanged by that split.
thresholds_version = "1.7.2"

[nve_energy_drift]
# Total-energy conservation for a strict NVE run on a near-equilibrium crystal.
# Checked as relative drift |E_final - E_init| / |E_init| and as a per-atom,
# per-ps absolute drift; the run passes if either bound holds.
# Justification (kept loose at v1.1): the acceptance run is short (sub-ps), so a
# single integration step's round-off dominates; the OR with an absolute
# per-atom/per-ps bound is the physically meaningful gate. Tighten once a
# longer-run baseline is established.
max_rel_drift = 5.0e-3
max_abs_drift_ha_per_atom_per_ps = 5.0e-3

[restart_determinism]
# A 20+20 step restart must reproduce a single 40-step run bit-for-bit-close.
position_atol_A = 1.0e-6
velocity_rtol = 1.0e-5

[nvt_mean_temperature]
# Mean temperature must lie within k_sigma standard errors of the MEAN of the
# target. The canonical per-sample spread is sigma_inst = T*sqrt(2/N_df); the
# standard error of the mean is sigma_inst/sqrt(N_eff). Because the thermostatted
# series is autocorrelated, N_eff is estimated by block averaging (n_blocks
# blocks) with the i.i.d. sqrt(n) value as a floor, so the window is never
# tighter than independent sampling would allow (which would false-fail) nor as
# loose as the raw instantaneous spread (which would false-pass).
# Justification: k_sigma = 6 is a deliberate false-negative guard — a correct
# thermostat sits within 6 standard errors of the target with overwhelming
# probability, so a failure is a real bias, not sampling noise. One-sided
# robustness margin, not a loose accuracy bound.
# Run length / discard / n_blocks are calibrated against the LJ reference so a
# correct v-rescale thermostat stays < 4 sigma over many seeds (12-seed max
# ~3.9) while the ~2 K standard error keeps the window (~12 K) sensitive enough
# to catch a real >12 K mean-temperature bias.
k_sigma = 6.0
n_blocks = 10
equilibration_fraction = 0.4           # discard the first 40% (initial transient)

[npt_pressure]
# The summary mean pressure must be built from the post-rescale series; the
# pre-rescale pair is retained only as a labeled diagnostic column.
require_post_rescale_summary = true

[npt_com_pressure_invariance]
# With COM translation excluded by the resolved DOF policy, adding a pure COM
# boost must not alter the active kinetic pressure or c-rescale volume response.
# The companion min_full_com_pressure_shift_bar proves the boost is large enough
# that a full-K pressure path would have moved by a resolvable amount.
max_abs_pressure_delta_bar = 1.0e-8
max_abs_volume_delta_A3 = 1.0e-7
min_full_com_pressure_shift_bar = 1.0e-2

[npt_volume_fluctuation]
# The barostat samples the correct ensemble iff the compressibility from the
# equilibrium volume fluctuations, kappa = Var(V)/(kB T <V>), matches the EOS
# secant slope -(1/<V>)(dV/dP) measured at two pressures. Pass when the two
# agree within a log10 tolerance (a self-consistency check, not a frozen value).
# Justification (loose v1.4): log10_kappa_tol = 0.8 (~factor 6) absorbs the
# finite-sampling error of Var(V) on an autocorrelated volume series, the EOS
# secant approximation, and the changed finite-step sampling under the
# reversible-Euler ordering. The tight NPT ship gate is the effective-energy
# drift class; this class remains a coarse "not wildly wrong" fluctuation sanity
# check until a longer-run, larger-cell baseline quantifies the residual.
log10_kappa_tol = 0.8
# P1, P2: a narrower range keeps the EOS secant close to the local kappa_T at P1
# (kappa_T stiffens with pressure), isolating barostat correctness from EOS
# curvature.  For the real-backend 24-atom CO2 validation cell, 500 bar left the
# registered linear-response range; 200 bar preserves a resolvable volume signal
# while keeping the secant inside the max_volume_change guard.
pressures_bar = [1.0, 200.0]
equilibration_fraction = 0.3           # discard the first 30% of each run
min_volume_change = 0.01               # below this the EOS secant has no signal -> skip
max_volume_change = 0.25               # above this the response is non-linear/unstable -> fail
n_blocks = 5                           # block averaging for Var(V) and its standard error
barostat_stride = 5                    # distribution-level validation of Bernetti-Bussi N_P stride
max_volume_drift_sigma = 3.0           # reject non-equilibrium relaxation windows before kappa
tau_p_fs = 500.0                       # pressure-coupling time for this validation class

[npt_effective_energy_drift]
# Reversible c-rescale conserved-quantity (effective-energy) drift. The NPT
# conserved quantity H̃ = K + U + P0·V − Σ ΔW_ext (thermostat + barostat +
# projection work) is constant under exact dynamics; its residual slope measures
# the finite-timestep integration error — the NPT analogue of the NVE energy
# drift, and the diagnostic a non-reversible/mis-scaled barostat fails even when
# instantaneous pressure looks fine. Bounded as a per-atom, per-ps |dH̃/dt|.
# Justification: calibrated against the LJ reference at dt=1 fs. A correct
# reversible integrator with complete work accounting holds |dH̃/dt| ~ 4e-10
# Ha/atom/ps; the bare K+U+P0·V (i.e. broken/absent work accounting) drifts
# ~1.2e-5 here, so 1e-6 passes the correct path with ~2000x margin while still
# catching a barostat that fails to account for its energy injection by >10x.
# Loose v1.2 for real ML backends (whose intrinsic NVE-style drift is larger);
# revisit with a real-backend baseline before tightening further.
max_abs_drift_ha_per_atom_per_ps = 1.0e-6

[stress_finite_difference]
# Full ASE Voigt virial stress [xx, yy, zz, yz, xz, xy] vs homogeneous-strain
# finite differences on a deformed triclinic LJ cell with non-zero shear. The
# sign must match and each component must satisfy at least one of the absolute,
# relative, or log-magnitude tolerances, evaluated at each delta.
# Tightened 1.0 -> 0.5 at v1.1: the LJ reference agrees to log10 ~0.0000 (the
# virial stress and -dE/dV are analytically the same quantity), so 0.5 (factor
# ~3) is a generous margin for real-backend autodiff/FD noise while still
# catching a wrong stress unit or a factor error.
deltas = [1.0e-3, 3.0e-4]
abs_tol_ev_per_ang3 = 1.0e-5
rel_tol = 5.0e-2
relative_error_floor_ev_per_ang3 = 1.0e-8
log10_magnitude_tol = 0.5
require_sign_match = true

[barostat_clamp]
# A production c-rescale NPT run must not trigger the per-step stability clamp: a
# fired clamp truncates the stochastic-cell-rescaling ensemble. The LJ reference near
# equilibrium clamps zero times, so the bound is exact (not a tolerance).
max_clamps = 0

[pbc_geometry]
# Wrapped <-> unwrapped image-flag reconstruction round-trip.
roundtrip_atol_A = 1.0e-9

[constraints]
# ASE constraints + MD must hard-reject (no silent fake-constraint dynamics).
require_rejection = true
